<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#e2e2de" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c1915" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="A generated video dream scrubbed against a stereo reconstruction of a real tank." />
    <title>Dive Twin</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      try { const t = localStorage.getItem("dt-theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Dive Twin needs JavaScript to play the clips and draw the curves.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
